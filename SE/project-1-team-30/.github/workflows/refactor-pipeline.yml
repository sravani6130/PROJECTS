name: Periodic Refactoring Pipeline

on:
  schedule:
    # Runs at 00:00 UTC every Sunday
    - cron: '0 0 * * 0'
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java 22
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Verify Environment & Check Checkout
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          echo "Checking for secrets (should be non-empty):"
          if [ -z "$GEMINI_API_KEY" ]; then echo "WARNING: GEMINI_API_KEY is missing"; else echo "GEMINI_API_KEY is present"; fi
          if [ -z "$REPO_ACCESS_TOKEN" ]; then echo "WARNING: REPO_ACCESS_TOKEN is missing"; else echo "REPO_ACCESS_TOKEN is present"; fi
          echo "Listing files in refactoring_pipeline/:"
          ls -R refactoring_pipeline/
          echo "Checking app directory:"
          ls -d app/src/main/java/org || echo "Source directory not found!"

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Run Refactoring Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 refactoring_pipeline/pipeline.py
