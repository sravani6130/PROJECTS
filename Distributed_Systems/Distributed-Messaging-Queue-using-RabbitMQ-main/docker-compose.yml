version: '3.8'

services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    hostname: rabbitmq1
    container_name: rabbitmq1
    ports:
      - "15672:15672" # for dashboard
      - "5672:5672" # for systems
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    environment:
      - RABBITMQ_ERLANG_COOKIE=distributed-broker-cookie
    networks:
      - rmq-net

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbitmq2
    container_name: rabbitmq2
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    environment:
      - RABBITMQ_ERLANG_COOKIE=distributed-broker-cookie
    depends_on:
      - rabbitmq1
    networks:
      - rmq-net

  rabbitmq3:
    image: rabbitmq:3.13-management
    hostname: rabbitmq3
    container_name: rabbitmq3
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    environment:
      - RABBITMQ_ERLANG_COOKIE=distributed-broker-cookie
    depends_on:
      - rabbitmq1
    networks:
      - rmq-net

  rabbitmq4:
    image: rabbitmq:3.13-management
    hostname: rabbitmq4
    container_name: rabbitmq4
    volumes:
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    environment:
      - RABBITMQ_ERLANG_COOKIE=distributed-broker-cookie
    depends_on:
      - rabbitmq1
    networks:
      - rmq-net

networks:
  rmq-net:
    driver: bridge # helps in forming mini DNS
