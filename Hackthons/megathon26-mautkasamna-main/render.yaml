# Render Blueprint: the Gullak NGO API + dashboard (one web service) and a
# PostgreSQL database. Deploy: Render dashboard → New → Blueprint → this repo.
# Free plan limits (Render docs): the service sleeps after 15 min without
# traffic (the first request then takes about a minute) and the free database
# expires 30 days after creation unless upgraded. Data lives in Postgres, so
# sleeping and redeploys do not lose students.
services:
  - type: web
    name: gullak-ngo
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && python -m app
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GULLAK_ENV
        value: production
      - key: GULLAK_HOST
        value: 0.0.0.0
      # Fictional demo NGOs, centres and codes (no public demo logins).
      - key: GULLAK_SEED_DEMO
        value: "false"
      - key: GULLAK_SEED_ORGS
        value: "true"
      - key: GULLAK_TRUST_PROXY
        value: "true"
      # The dashboard is served by this service (same origin): no CORS.
      - key: GULLAK_CORS_ORIGINS
        value: ""
      # A whole classroom may enrol from one school network address.
      - key: GULLAK_ENROL_RATE_PER_MINUTE
        value: "120"
      # Dashboard passwords: random values generated by Render. Read them in
      # the service's Environment tab; never commit them.
      - key: GULLAK_PASSWORD_GREEN
        generateValue: true
      - key: GULLAK_PASSWORD_UDAAN
        generateValue: true
      - key: GULLAK_PASSWORD_YFC
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: gullak-db
          property: connectionString

databases:
  - name: gullak-db
    plan: free
    region: singapore
    databaseName: gullak
    user: gullak
