<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Algebra Chatbot</title>

    <!-- Markdown Renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .msg {
            margin: 10px 0;
            padding: 12px 16px;
            border-radius: 10px;
            max-width: 70%;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #0078ff;
            color: white;
            margin-left: auto;
        }

        .assistant {
            background: #e3e9f0;
            color: black;
            margin-right: auto;
        }

        #input-box {
            display: flex;
            padding: 10px;
            background: white;
            border-top: 1px solid #ccc;
        }

        #msg-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        #send-btn {
            margin-left: 8px;
            padding: 12px 20px;
            background: #0078ff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #send-btn:hover {
            background: #005fcc;
        }

    /* Markdown Styling for Assistant Messages */

    /* Headings – reduce big default margins */
    .assistant h1,
    .assistant h2,
    .assistant h3 {
        margin: 6px 0 4px 0 !important;
    }

    /* Paragraph spacing – prevent large gaps */
    .assistant p {
        margin: 4px 0 !important;
    }

    /* Inline code */
    .assistant code {
        background: #f0f0f0;
        padding: 2px 6px;
        border-radius: 4px;
    }

    /* Code blocks */
    .assistant pre {
        background: #2d2d2d;
        color: #f8f8f2;
        padding: 10px;
        border-radius: 8px;
        overflow-x: auto;
        white-space: pre;
        margin: 6px 0 !important;   /* reduced spacing */
    }

    /* Lists */
    .assistant ul,
    .assistant ol {
        padding-left: 22px !important;
        margin: 4px 0 !important;   /* tighten space above/below lists */
    }

    .assistant li {
        margin: 3px 0 !important;   /* prevent big gaps between bullets */
    }

    /* Tables */
    .assistant table {
        border-collapse: collapse;
        width: 100%;
        margin: 6px 0 !important;   /* reduce vertical spacing */
    }

    .assistant th,
    .assistant td {
        border: 1px solid #ccc;
        padding: 6px;
    }

    </style>
</head>

<body>

    <div id="chat-container"></div>

    <div id="input-box">
        <input id="msg-input" type="text" placeholder="Type your message..." />
        <button id="send-btn">Send</button>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000/chat";  // FastAPI Endpoint
        let conversationHistory = [];

        const chatContainer = document.getElementById("chat-container");
        const msgInput = document.getElementById("msg-input");
        const sendBtn = document.getElementById("send-btn");

        /** Add message to UI with Markdown support */
        function addMessage(role, content) {
            const div = document.createElement("div");
            div.className = "msg " + (role === "user" ? "user" : "assistant");

            if (role === "assistant") {
                // Render markdown safely
                div.innerHTML = marked.parse(content);
            } else {
                div.textContent = content;  // user text stays plain
            }

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        /** Send message to FastAPI backend */
        async function sendMessage() {
            const userText = msgInput.value.trim();
            if (!userText) return;

            addMessage("user", userText);
            msgInput.value = "";

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_input: userText,
                        conversation_history: conversationHistory
                    })
                });

                const data = await response.json();

                // Display assistant markdown output
                addMessage("assistant", data.final_output);

                // Update conversation history
                conversationHistory = data.updated_history;

            } catch (err) {
                addMessage("assistant", "⚠️ Error contacting server.");
                console.error(err);
            }
        }

        sendBtn.addEventListener("click", sendMessage);
        msgInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendMessage();
        });
    </script>

</body>
</html>
